name: syncloud

on:
  push:
    tags:
      - '*-syncloud.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container: rust:1.95-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y clang libclang-dev liburing-dev
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          RUSTFLAGS: -C relocation-model=static -C target-feature=+crt-static -C link-arg=-l:libstdc++.a -C link-arg=-l:libc.a -C link-arg=-l:libm.a
      - run: cp target/${{ matrix.target }}/release/tuwunel tuwunel-${{ matrix.arch }}
      - run: ./tuwunel-${{ matrix.arch }} --version
      - run: ldd tuwunel-${{ matrix.arch }} || true
      - uses: softprops/action-gh-release@v2
        with:
          files: tuwunel-${{ matrix.arch }}
